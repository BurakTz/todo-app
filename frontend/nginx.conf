server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # React Router client-side routing icin kritik satir:
    # /tasks, /login gibi bir path'e dogrudan girilince, Nginx once
    # o path'te gercek bir dosya arar (bulamaz), sonra index.html'e
    # duser - boylece React uygulamasi kendi routing'ini devreye sokar.
    location / {
        try_files $uri $uri/ /index.html;
    }
}